apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: trading-data
  labels:
    app: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
      - name: redpanda
        image: docker.redpanda.com/redpandadata/redpanda:v23.3.16
        args:
          - redpanda
          - start
          - --overprovisioned
          - --smp
          - "1"
          - --memory
          - 1G
          - --reserve-memory
          - 0M
          - --node-id
          - "0"
          - --check=false
          - --kafka-addr
          - PLAINTEXT://0.0.0.0:9092
          - --advertise-kafka-addr
          - PLAINTEXT://redpanda.trading-data.svc.cluster.local:9092
        ports:
        - containerPort: 9092
          name: kafka
        readinessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 9092
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: trading-data
spec:
  selector:
    app: redpanda
  ports:
  - name: kafka
    port: 9092
    targetPort: 9092
