  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: market-data-adapter-config
    namespace: trading-apps
  data:
    KAFKA_BOOTSTRAP_SERVERS: "redpanda.trading-data.svc.cluster.local:9092"
    POSTGRES_HOST: "postgres.trading-data.svc.cluster.local"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "tradingdb"
    POSTGRES_USER: "trading"
    POSTGRES_PASSWORD: "trading"
    LOG_LEVEL: "INFO"
    TICK_HZ: "5"
SYMBOLS: "AAPL,MSFT,GOOG"
TOPIC_TICKS: "md.ticks"
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: market-data-adapter
    namespace: trading-apps
    labels:
      app: market-data-adapter
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: market-data-adapter
    template:
      metadata:
        labels:
          app: market-data-adapter
      spec:
        containers:
        - name: market-data-adapter
          image: image-registry.openshift-image-registry.svc:5000/trading-apps/market-data-adapter:0.1.0
          imagePullPolicy: Always
          envFrom:
          - configMapRef:
              name: market-data-adapter-config
          ports:
          - containerPort: 8080
            name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: market-data-adapter
    namespace: trading-apps
  spec:
    selector:
      app: market-data-adapter
    ports:
    - name: http
      port: 80
      targetPort: 8080
