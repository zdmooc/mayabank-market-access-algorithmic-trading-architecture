  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: strategy-runner-config
    namespace: trading-apps
  data:
    KAFKA_BOOTSTRAP_SERVERS: "redpanda.trading-data.svc.cluster.local:9092"
    POSTGRES_HOST: "postgres.trading-data.svc.cluster.local"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "tradingdb"
    POSTGRES_USER: "trading"
    POSTGRES_PASSWORD: "trading"
    LOG_LEVEL: "INFO"
    TOPIC_BARS: "md.bars"
TOPIC_SIGNALS: "strategy.signals"
FAST_MA: "3"
SLOW_MA: "8"
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: strategy-runner
    namespace: trading-apps
    labels:
      app: strategy-runner
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: strategy-runner
    template:
      metadata:
        labels:
          app: strategy-runner
      spec:
        containers:
        - name: strategy-runner
          image: image-registry.openshift-image-registry.svc:5000/trading-apps/strategy-runner:0.1.0
          imagePullPolicy: Always
          envFrom:
          - configMapRef:
              name: strategy-runner-config
          ports:
          - containerPort: 8080
            name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: strategy-runner
    namespace: trading-apps
  spec:
    selector:
      app: strategy-runner
    ports:
    - name: http
      port: 80
      targetPort: 8080
